# Builds gh-yap-tui for every OS/arch and attaches the binaries to the release,
# so `gh extension install josemingorance/gh-yap-tui` needs no Go at all.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
